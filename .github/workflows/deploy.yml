name: Deploy (Docker Build + Push)

on:
  push:
    branches: [ main ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build server image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mean-server:latest ./server

      - name: Build client image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mean-client:latest ./client

      - name: Push server image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/mean-server:latest

      - name: Push client image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/mean-client:latest
